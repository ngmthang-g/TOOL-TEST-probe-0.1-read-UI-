name: apply-v012

on:
  push:
    paths:
      - '.apply-v012/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-build-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout apply commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified v0.1.2 source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem .apply-v012/part* | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source parts, found $($parts.Count)" }
          $zip = Join-Path $env:RUNNER_TEMP 'v012-source.zip'
          $out = [System.IO.File]::Open($zip, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          try {
            foreach ($p in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
              $out.Write($bytes, 0, $bytes.Length)
            }
          } finally { $out.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '5bea35b4ec8574efee14082e96c1aa8a655112a3d82f26dae1059d1ea4be0e8e') { throw "Source archive SHA256 mismatch: $hash" }
          $src = Join-Path $env:RUNNER_TEMP 'v012-source'
          Expand-Archive -Path $zip -DestinationPath $src -Force
          Copy-Item (Join-Path $src '*') . -Recurse -Force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependency
        shell: pwsh
        run: python -m pip install pytest

      - name: Supply final workflow contract for tests
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes('.github/workflows/build-windows.yml', [Convert]::FromBase64String(''))

      - name: Source contract tests
        shell: pwsh
        run: python -m pytest -q tests/test_source_contract.py

      - name: Publish v0.1.2 source
        shell: pwsh
        run: |
          git checkout -- .github/workflows/build-windows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md CHANGELOG.md PROJECT_KNOWLEDGE.md VERSION.txt .gitignore src tests docs
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat: probe v0.1.2 EventSystem direct resolver [skip ci]"
            git push
          }

      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage v0.1.2 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/bin/ProbeController.exe artifact/ProbeController.exe
          Copy-Item build/bin/ProbeBridge.dll artifact/ProbeBridge.dll
          Copy-Item README.md artifact/README.md
          Copy-Item VERSION.txt artifact/VERSION.txt

      - name: Upload v0.1.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-UI-Internal-Probe-v0.1.2-win-x64
          path: artifact/
          if-no-files-found: error

      - name: Publish v0.1.2 binaries to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item artifact/ProbeController.exe dist/ProbeController.exe
          Copy-Item artifact/ProbeBridge.dll dist/ProbeBridge.dll
          Compress-Archive -Path artifact/* -DestinationPath dist/ThanLong-UI-Internal-Probe-v0.1.2-win-x64.zip -Force
          git add dist
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: publish probe v0.1.2 binaries [skip ci]"
            git push
          }
