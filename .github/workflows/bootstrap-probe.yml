name: Bootstrap UI Probe v0.1

on:
  push:
    paths:
      - '.bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-build-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore tested source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem .bootstrap/probe_source.part* | Sort-Object Name
          $out = [System.IO.File]::OpenWrite("probe_source.tar.xz")
          foreach ($part in $parts) {
            $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
            $out.Write($bytes, 0, $bytes.Length)
          }
          $out.Close()
          python -c "import tarfile; t=tarfile.open('probe_source.tar.xz','r:xz'); t.extractall('.'); t.close()"
          Remove-Item probe_source.tar.xz

      - name: Publish source snapshot first
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: publish UI internal probe v0.1 source [skip ci]"
            git push
          }

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run source contract tests
        run: python -m pytest -q tests/test_source_contract.py

      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/ProbeController.exe dist/ProbeController.exe
          Copy-Item build/bin/ProbeBridge.dll dist/ProbeBridge.dll
          Copy-Item README.md dist/README.md
          Copy-Item VERSION.txt dist/VERSION.txt
          Compress-Archive -Force -Path dist/ProbeController.exe,dist/ProbeBridge.dll,dist/README.md,dist/VERSION.txt -DestinationPath dist/ThanLong-UI-Internal-Probe-v0.1-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-UI-Internal-Probe-v0.1-win-x64
          path: |
            dist/ProbeController.exe
            dist/ProbeBridge.dll
            dist/README.md
            dist/VERSION.txt
            dist/ThanLong-UI-Internal-Probe-v0.1-win-x64.zip
          if-no-files-found: error

      - name: Publish dist and remove bootstrap payload
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .bootstrap
          Remove-Item -Force .github/workflows/bootstrap-probe.yml
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: publish probe v0.1 Windows x64 binaries [skip ci]"
            git push
          }
