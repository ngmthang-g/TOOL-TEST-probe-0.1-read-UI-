name: bootstrap-v0.1.1-f8-fix

on:
  push:
    paths:
      - '.bootstrap-v011/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-build-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore v0.1.1 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem .bootstrap-v011/probe_source.part* | Sort-Object Name
          $out = [System.IO.File]::OpenWrite('probe_v011_source.tar.xz')
          foreach ($part in $parts) {
            $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
            $out.Write($bytes, 0, $bytes.Length)
          }
          $out.Close()
          python -c "import tarfile; t=tarfile.open('probe_v011_source.tar.xz','r:xz'); t.extractall('.'); t.close()"
          Remove-Item probe_v011_source.tar.xz

      - name: Publish v0.1.1 source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: publish v0.1.1 F8 runtime fix"
            git push
          }

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Source contract tests
        run: python -m pytest -q tests/test_source_contract.py

      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage v0.1.1 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/bin/ProbeController.exe artifact/ProbeController.exe
          Copy-Item build/bin/ProbeBridge.dll artifact/ProbeBridge.dll
          Copy-Item README.md artifact/README.md
          Copy-Item VERSION.txt artifact/VERSION.txt
          Compress-Archive -Force -Path artifact/* -DestinationPath artifact/ThanLong-UI-Internal-Probe-v0.1.1-win-x64.zip

      - name: Upload v0.1.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-UI-Internal-Probe-v0.1.1-win-x64
          path: artifact/
          if-no-files-found: error

      - name: Publish v0.1.1 binaries to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item artifact/ProbeController.exe dist/ProbeController.exe -Force
          Copy-Item artifact/ProbeBridge.dll dist/ProbeBridge.dll -Force
          Copy-Item artifact/ThanLong-UI-Internal-Probe-v0.1.1-win-x64.zip dist/ThanLong-UI-Internal-Probe-v0.1.1-win-x64.zip -Force
          git add dist
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: publish probe v0.1.1 binaries [skip ci]"
            git push
          }
