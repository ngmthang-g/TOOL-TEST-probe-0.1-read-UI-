name: build-windows

on:
  push:
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Source contract tests
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_source_contract.py

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage runtime and source packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/bin/ProbeController.exe artifact/ProbeController.exe
          Copy-Item build/bin/ProbeBridge.dll artifact/ProbeBridge.dll
          Copy-Item README.md artifact/README.md
          Copy-Item VERSION.txt artifact/VERSION.txt
          Remove-Item tests/__pycache__ -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path CMakeLists.txt,README.md,VERSION.txt,CHANGELOG.md,PROJECT_KNOWLEDGE.md,src,tests,docs,.github -DestinationPath artifact/ThanLong-UI-Internal-Probe-v0.1.4-source.zip -Force
          Compress-Archive -Path artifact/ProbeController.exe,artifact/ProbeBridge.dll,artifact/README.md,artifact/VERSION.txt -DestinationPath artifact/ThanLong-UI-Internal-Probe-v0.1.4-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-UI-Internal-Probe-v0.1.4-win-x64
          path: artifact/
          if-no-files-found: error

      - name: Publish binaries and source to dist
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item artifact/ProbeController.exe dist/ProbeController.exe
          Copy-Item artifact/ProbeBridge.dll dist/ProbeBridge.dll
          Copy-Item artifact/ThanLong-UI-Internal-Probe-v0.1.4-win-x64.zip dist/ThanLong-UI-Internal-Probe-v0.1.4-win-x64.zip
          Copy-Item artifact/ThanLong-UI-Internal-Probe-v0.1.4-source.zip dist/ThanLong-UI-Internal-Probe-v0.1.4-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "build: publish probe v0.1.4 binaries and source [skip ci]"
          git push
