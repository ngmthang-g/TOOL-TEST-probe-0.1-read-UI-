name: build-windows

on:
  push:
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Source contract tests
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_source_contract.py

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/bin/ProbeController.exe artifact/ProbeController.exe
          Copy-Item build/bin/ProbeBridge.dll artifact/ProbeBridge.dll
          Copy-Item README.md artifact/README.md
          Copy-Item VERSION.txt artifact/VERSION.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-UI-Internal-Probe-v0.1-win-x64
          path: artifact/
          if-no-files-found: error

      - name: Publish binaries to dist
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item artifact/ProbeController.exe dist/ProbeController.exe
          Copy-Item artifact/ProbeBridge.dll dist/ProbeBridge.dll
          Compress-Archive -Path artifact/* -DestinationPath dist/ThanLong-UI-Internal-Probe-v0.1-win-x64.zip -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "build: publish probe v0.1 binaries [skip ci]"
          git push
