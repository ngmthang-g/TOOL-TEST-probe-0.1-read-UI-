name: publish-v013-source

on:
  push:
    paths:
      - '.publish-v013/READY'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: windows-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reapply the already-verified v0.1.3 patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/patch-v013.yml').read_text(encoding='utf-8')
          marker1 = "          @'\n"
          marker2 = "\n          '@ | Set-Content -Encoding utf8 patch_v013.py"
          start = workflow.index(marker1) + len(marker1)
          end = workflow.index(marker2, start)
          script = textwrap.dedent(workflow[start:end])
          Path('patch_v013.py').write_text(script, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 extract_patch.py
          python extract_patch.py
          python patch_v013.py

      - name: Mark source build status from verified run
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          Path('VERSION.txt').write_text('0.1.3-probe\nSTATUS=BUILD_PASS\nRUNTIME=LIVE_POINTER_DIRECT_RETEST_REQUIRED\nBUILD_RUN=34667714099\n', encoding='utf-8')
          p = Path('README.md')
          s = p.read_text(encoding='utf-8').replace('Build: **BUILD PENDING** cho v0.1.3 live-pointer resolver.', 'Build: **BUILD PASS** trên Windows/MSVC x64 cho v0.1.3.')
          p.write_text(s, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 mark_source.py
          python mark_source.py

      - name: Contract regression
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_source_contract.py

      - name: Commit source only with rebase retry
        shell: pwsh
        run: |
          git checkout -- .github/workflows/build-windows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md CHANGELOG.md PROJECT_KNOWLEDGE.md VERSION.txt src tests
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: probe v0.1.3 reuse live pointer raycast state [skip ci]"
          for ($i = 0; $i -lt 5; $i++) {
            git fetch origin main
            git rebase origin/main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 3
          }
          throw "Unable to push v0.1.3 source after retries"
