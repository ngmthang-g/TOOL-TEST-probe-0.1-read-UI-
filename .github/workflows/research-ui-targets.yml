name: apply-exact-target-guard

on:
  push:
    branches:
      - feature/ui-switch-targets-v0.1.4
    paths:
      - 'tools/apply_exact_target_patch.py'
      - '.github/workflows/research-ui-targets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-switch-targets-v0.1.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact target + directional guard patch
        run: python tools/apply_exact_target_patch.py
      - name: Contract check after patch
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_source_contract.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/probe_bridge_impl_4.inl src/probe_controller_impl_2.inl
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: use exact UI identities and directional guard"
          git push origin HEAD:feature/ui-switch-targets-v0.1.4
